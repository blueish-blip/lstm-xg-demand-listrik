<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediksi Beban Listrik Panama</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>Panama Energy Demand</h1>
        <p>Swiss Minimalist Predictive Analytics</p>
    </header>

    <main>
        <section class="metrics">
            <div class="card">
                <h3>XGBoost MSE</h3>
                <p class="value">17,872.25</p>
            </div>
            <div class="card">
                <h3>LSTM MSE</h3>
                <p class="value">18,540.12</p>
            </div>
        </section>

        <section class="chart-container">
            <canvas id="demandChart"></canvas>
        </section>

        <section class="about">
            <h2>Model Methodology</h2>
            <p>Utilizing high-frequency temporal data to model national electricity demand. XGBoost provides structural efficiency, while LSTM captures long-term seasonal dependencies.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
