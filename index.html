<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediksi Beban Listrik Panama</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Panama Energy Demand</h1>
            <p>Predictive Analytics Dashboard</p>
        </header>

        <main class="dashboard-grid">
            <!-- Metrics -->
            <div class="card">
                <h3>XGBoost MSE</h3>
                <p class="result-display">17,872.25</p>
            </div>
            <div class="card">
                <h3>LSTM MSE</h3>
                <p class="result-display">18,540.12</p>
            </div>

            <!-- Calculator -->
            <div class="card">
                <h3>Kalkulator Prediksi</h3>
                <div class="input-group">
                    <label>Suhu (°C)</label>
                    <input type="number" id="temp" value="27">
                </div>
                <div class="input-group">
                    <label>Jam (0-23)</label>
                    <input type="number" id="hour" value="12">
                </div>
                <button id="predict-btn">Hitung Prediksi</button>
                <div id="prediction-result" class="result-display">-- MW</div>
            </div>

            <!-- Chart -->
            <div class="card">
                <h3>Visualisasi Beban</h3>
                <canvas id="demandChart"></canvas>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
